name: Daily 429 Check

on:
  schedule:
    # UTC 06:00 (TSİ 09:00)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run Script
        run: python grafana_429_check_influx.py
